name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Next.js build
        run: npm run build

      # OpenNext Cloudflare adapter requires Linux; verifies the worker bundle.
      - name: OpenNext Cloudflare build
        run: npm run cf-build
