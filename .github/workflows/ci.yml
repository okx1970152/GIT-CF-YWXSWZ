name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      CONTENT_REPO: ${{ vars.CONTENT_REPO }}
      CONTENT_REPO_REF: ${{ vars.CONTENT_REPO_REF }}
      CONTENT_REPO_NOVELS_PATH: ${{ vars.CONTENT_REPO_NOVELS_PATH }}
      CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Next.js build
        run: npm run build

      # OpenNext Cloudflare adapter requires Linux; verifies the worker bundle.
      - name: OpenNext Cloudflare build
        if: ${{ env.CONTENT_REPO_TOKEN != '' }}
        run: npm run cf-build

      - name: Skip OpenNext build (missing CONTENT_REPO_TOKEN)
        if: ${{ env.CONTENT_REPO_TOKEN == '' }}
        run: echo "Skipping cf-build because CONTENT_REPO_TOKEN is not available in this workflow context."
