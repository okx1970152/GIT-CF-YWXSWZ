name: Deploy To Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 构建阶段（从私有内容仓拉 novels）
      CONTENT_REPO: ${{ vars.CONTENT_REPO }}
      CONTENT_REPO_REF: ${{ vars.CONTENT_REPO_REF }}
      CONTENT_REPO_NOVELS_PATH: ${{ vars.CONTENT_REPO_NOVELS_PATH }}
      CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}

      # 运行时配置（从 GitHub Secrets/Variables 注入到 Worker）
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      # 广告写回 GitHub（可选）
      APP_GH_TOKEN: ${{ secrets.APP_GH_TOKEN }}
      APP_GITHUB_REPO: ${{ vars.APP_GITHUB_REPO }}
      APP_GITHUB_BRANCH: ${{ vars.APP_GITHUB_BRANCH }}
      APP_GITHUB_ADS_PATH: ${{ vars.APP_GITHUB_ADS_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext bundle
        run: npm run cf-build

      - name: Deploy to Cloudflare Worker (inject runtime vars)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --var ADMIN_PASSWORD:"$ADMIN_PASSWORD" \
            --var ADMIN_SESSION_SECRET:"$ADMIN_SESSION_SECRET" \
            --var NEXT_PUBLIC_SITE_URL:"$NEXT_PUBLIC_SITE_URL" \
            --var APP_GH_TOKEN:"$APP_GH_TOKEN" \
            --var APP_GITHUB_REPO:"$APP_GITHUB_REPO" \
            --var APP_GITHUB_BRANCH:"$APP_GITHUB_BRANCH" \
            --var APP_GITHUB_ADS_PATH:"$APP_GITHUB_ADS_PATH"
