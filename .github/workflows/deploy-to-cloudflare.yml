name: Deploy To Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      CONTENT_REPO: ${{ vars.CONTENT_REPO }}
      CONTENT_REPO_REF: ${{ vars.CONTENT_REPO_REF }}
      CONTENT_REPO_NOVELS_PATH: ${{ vars.CONTENT_REPO_NOVELS_PATH }}
      CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}

      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}

      APP_GITHUB_REPO: ${{ vars.APP_GITHUB_REPO }}
      APP_GITHUB_BRANCH: ${{ vars.APP_GITHUB_BRANCH }}
      APP_GITHUB_ADS_PATH: ${{ vars.APP_GITHUB_ADS_PATH }}
      APP_GH_TOKEN: ${{ secrets.APP_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext bundle
        run: npm run cf-build

      - name: Upload content diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-diagnostics
          path: diagnostics/
          if-no-files-found: warn

      - name: Deploy to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
