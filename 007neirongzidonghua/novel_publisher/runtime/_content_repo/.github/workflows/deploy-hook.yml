name: Trigger Frontend Deploy
on:
  push:
    branches: [main]
    paths:
      - "novels/**"
      - ".github/workflows/deploy-hook.yml"
  workflow_dispatch:
jobs:
  trigger-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger frontend repository deploy workflow
        env:
          GH_TOKEN: ${{ secrets.FRONTEND_REPO_TRIGGER_TOKEN }}
          FRONTEND_OWNER: okx1970152
          FRONTEND_REPO: GIT-CF-YWXSWZ
          FRONTEND_WORKFLOW_FILE: deploy-to-cloudflare.yml
          FRONTEND_REF: main
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing secret: FRONTEND_REPO_TRIGGER_TOKEN"
            exit 1
          fi
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/${FRONTEND_OWNER}/${FRONTEND_REPO}/actions/workflows/${FRONTEND_WORKFLOW_FILE}/dispatches \
            -d "{\"ref\":\"${FRONTEND_REF}\"}"
          echo "Triggered ${FRONTEND_OWNER}/${FRONTEND_REPO} workflow: ${FRONTEND_WORKFLOW_FILE} @ ${FRONTEND_REF}"
